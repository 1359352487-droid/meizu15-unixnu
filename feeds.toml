# Device sources for the Meizu 15, merged over the base feeds.toml by "unixnu fetch".
#
# Copied verbatim from Chromitsune/UniXNU-Lavender: these three are not
# board-specific, they are the pinned revisions every SDM660 port links against.
# Keeping the exact same commits matters -- the kernel patches in UniXNU target
# these revisions, and the storage ABI audit was qualified against this
# IOStorageFamily commit.

# The pinned 2023 crypto provider the source-crypto kernel configuration links
# (built by the base scripts/build-corecrypto-14.py; only the pinned revision is trusted).
[[source]]
name = "corecrypto-2023"
kind = "refer"
git = "https://github.com/ONLYA/corecrypto-2023"
ref = "main"
commit = "11fba65b12d8830630e248dfa8344caf8b065f26"

# The ordinary ARM64 block storage interface, qualified by the storage ABI
# audit before the native block driver is compiled against it.
[[source]]
name = "IOStorageFamily"
kind = "refer"
git = "https://github.com/apple-oss-distributions/IOStorageFamily.git"
ref = "main"
commit = "e45fbe30a7879e0b16e26dddb78538f1b00e0bff"

# The matching Darwin 22 pthread component, registered by the source-pthread
# bootstrap patch.
[[source]]
name = "libpthread"
kind = "refer"
git = "https://github.com/apple-oss-distributions/libpthread.git"
ref = "rel/libpthread-519"
commit = "c0e60fb5ecfc54cf379c261d3f9572cc22ded891"

# The XNU the Meizu 15 prelinks against: iOS 16.7.16 ships xnu-8796.141.3, and
# this commit is exactly what the Redmi Note 7 (lavender) port pins in its
# unixnu.lock. UniXNU's own feeds.toml pins xnu-10063.141.1 (iOS 17 / Darwin
# 23.6.0) instead, which cannot drive an iOS 16 kernelcache. A device feeds.toml
# overrides the base source of the same name.
[[source]]
name = "xnu"
kind = "refer"
git = "https://github.com/apple-oss-distributions/xnu.git"
ref = "xnu-8796.141.3"
commit = "1b191cb58250d0705d8a51287127505aa4bc0789"
darwin = "22.6.0"
version = "8796.141.3"
