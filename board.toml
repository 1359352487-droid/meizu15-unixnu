# Board description of the Meizu 15 (M8810, SDM660), schema 2.
#
# Schema 1 (kept as board.v1.toml) is accepted by unixnu but never resolves a
# patch series: `patches.plan()` is only called when schema_version == 2, so the
# kernel step would compile XNU with zero UniXNU patches. This file is the
# schema-2 form, pointing at the OS profile this repository carries itself
# (profiles/os/ios-16.7.16-20H392) because UniXNU's own profiles stop at iPadOS 17.
#
# Physical values are pinned from this phone: docs/hardware.md and TESTLOG.md.

schema_version = 2

[board]
name = "meizu15"
soc = "SDM660"
os_profile = "ios-16.7.16-20H392"
description = "Meizu 15 (M8810, eMMC, 4 GB DRAM, 1080x1920 AMOLED panel)"
kit = "meizu15"

# The kernel-side pieces this port links. ArmDTPlatform/ArmCpu give the Apple
# device-tree platform expert and the GIC/timer plumbing; SoftwareAES is the
# fallback crypto (SDM660 has no usable inline AES path for XNU yet);
# XnuPrelink is the prelink kit; DarwinBoot is the handover driver.
[components]
include = ["ArmDTPlatform", "ArmCpu", "SoftwareAES", "XnuPrelink", "DarwinBoot"]

[kernel]
defconfig = "meizu15_defconfig"
# arch and device series only: UniXNU has no profiles/soc profile for SDM660,
# so there is no soc-level series to include yet.
config_fragments = ["arch:configs/common.config"]
patch_series = ["arch:patches/xnu/series", "device:patches/xnu/series"]

# The stock bootloader expects the splash region in the device tree or it powers
# the panel off. Pinned from this phone's own FDT (reg 0x9d400000/0x02400000).
[[bootimg.dtb_node]]
path = "/reserved-memory/splash_region@9d400000"
props = [
  { name = "label", type = "s", value = "cont_splash_mem" },
  { name = "reg", type = "x", value = ["0x0", "0x9d400000", "0x0", "0x2400000"] },
]

[bootimg.image]
base = 0x0
kernel_offset = 0x8000
ramdisk_offset = 0x1000000
second_offset = 0xf00000
tags_offset = 0x100
pagesize = 4096
header_version = 0

# NOT used for this board: the bootable UEFI firmware comes from
# .github/workflows/build-meizu15-fix.yml on top of edk2-porting/edk2-msm and is
# already proven on the device (SimpleInit menu + UEFI Shell, see TESTLOG.md).
# Kept out of the way so `unixnu build firmware` is simply not run.
[firmware]
config = "meizu15"
dsc = "Meizu15Pkg/Meizu15Pkg.dsc"
fd = "Build/Meizu15Pkg/{target}_GCC5/FV/MEIZU15PKG_UEFI.fd"
