SOC_PLATFORM="SDM660"
VENDOR_NAME="Meizu"
PLATFORM_NAME="meizu15"

# mkbootimg config
# Meizu 15 ships Android 7.1.1 (Flyme 7.0.2.2A), build NGI77B, Aug 2018.
# The boot image header version matters: this bootloader predates v2/v3/v4
# headers, so stay on v1 (0 keeps the legacy layout, which the stock boot.img
# in dump/boot.img confirms: header_version == 0 there).
BOOTIMG_OS_PATCH_LEVEL="2018-04"
BOOTIMG_OS_VERSION=7.1.1
BOOTIMG_HEADER_VERSION=1
