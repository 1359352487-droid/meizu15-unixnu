name: build-meizu15-uefi

# Builds Meizu15Pkg into MEIZU15PKG_UEFI.fd on a free ubuntu runner.
# Nothing is installed on the phone; this only produces a firmware volume.
#
# All 67 components are PREBUILT binaries carved from this phone's XBL
# (see ../docs/dxe-drivers.md). There is no driver source in this repository,
# so the build is just EDK2 wrapping the .efi files into a firmware volume.

on:
  workflow_dispatch:
  push:
    paths:
      - 'edk2-firmware-build/**'
      - '.github/workflows/build-uefi.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential uuid-dev iasl nasm python3 python3-pip \
            gcc-aarch64-linux-gnu

      - name: Fetch EDK2
        run: |
          git clone --depth 1 --branch edk2-stable202408 \
            https://github.com/tianocore/edk2.git
          cd edk2
          git submodule update --init --depth 1
          make -C BaseTools -j"$(nproc)"

      - name: Install package
        run: |
          cp -r edk2-firmware-build/Meizu15Pkg edk2/
          # binary-only INF files still need at least one package to resolve into
          python3 - <<'PY'
          import pathlib, re
          dec = pathlib.Path('edk2/Meizu15Pkg/Meizu15Pkg.dec').read_text()
          for inf in pathlib.Path('edk2/Meizu15Pkg/Drivers').glob('*/*.inf'):
              t = inf.read_text()
              if '[Packages]' not in t:
                  t += '\n[Packages]\n  Meizu15Pkg/Meizu15Pkg.dec\n  MdePkg/MdePkg.dec\n'
                  inf.write_text(t)
          print('patched', len(list(pathlib.Path('edk2/Meizu15Pkg/Drivers').glob('*/*.inf'))), 'INF')
          PY

      - name: Build firmware volume
        run: |
          cd edk2
          export WORKSPACE="$PWD"
          export PACKAGES_PATH="$PWD"
          export GCC5_AARCH64_PREFIX=aarch64-linux-gnu-
          export EDK_TOOLS_PATH="$PWD/BaseTools"
          source ./edksetup.sh BaseTools
          build -a AARCH64 -t GCC5 -b RELEASE \
                -p Meizu15Pkg/Meizu15Pkg.dsc \
                -n "$(nproc)" \
                -D BLOCK_SIZE=0x00010000

      - name: Locate output
        run: |
          find edk2/Build/Meizu15Pkg -name '*.fd' -printf '%p  %s bytes\n' || true
          find edk2/Build/Meizu15Pkg -name '*.Fv' -printf '%p  %s bytes\n' || true

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: MEIZU15PKG_UEFI
          path: |
            edk2/Build/Meizu15Pkg/*/FV/*.fd
            edk2/Build/Meizu15Pkg/*/FV/*.Fv
          if-no-files-found: error
