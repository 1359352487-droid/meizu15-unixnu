name: build-meizu15-edk2msm

# Builds a fastboot-bootable UEFI image for the Meizu 15 (M8810, SDM660) on top of
# edk2-porting/edk2-msm, which already carries a complete SDM660 silicon layer
# (Silicon/Qualcomm/sdm660) used by several shipping device ports.
#
# This is a different (and much more promising) path than the self-assembled
# Meizu15Pkg in edk2-firmware-build/: that one only produces a DXE volume with no
# SEC/PrePi entry point, whereas edk2-msm ships the full boot chain plus BootShim
# and an mkbootimg wrapper.

on:
  workflow_dispatch:
  push:
    paths:
      - 'edk2-msm-overlay/**'
      - '.github/workflows/build-edk2msm.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150

    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential uuid-dev iasl nasm python3 python3-pip \
            gcc-aarch64-linux-gnu clang lld llvm gettext device-tree-compiler
          clang --version | head -1
          aarch64-linux-gnu-gcc --version | head -1
          # CLANG38 invokes llvm-ar as the archiver; without it every library
          # fails with "/bin/sh: 1: llvm-ar: not found" (Error 127).
          if ! command -v llvm-ar >/dev/null; then
            for c in /usr/lib/llvm-*/bin/llvm-ar; do
              [ -x "$c" ] && sudo ln -sf "$c" /usr/local/bin/llvm-ar && break
            done
          fi
          llvm-ar --version | head -1

      - name: Pin GCC 12 for BaseTools
        run: |
          set -eux
          # edk2-msm's vendored edk2 carries Pccts (antlr/dlg) sources written in
          # pre-ANSI style. Newer GCC rejects them:
          #   main.c:163: error: too many arguments to function 'p->process'
          #   GNUmakefile:86: VfrCompile/VfrLexer.h Error 2
          # BaseTools is a HOST tool, so an older host compiler is enough; the
          # UEFI target code still goes through aarch64-linux-gnu-gcc.
          if apt-cache policy gcc-12 2>/dev/null | grep -q Candidate; then
            sudo apt-get install -y --no-install-recommends gcc-12 g++-12
            sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-12 100
            sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-12 100
          else
            echo "::warning::gcc-12 unavailable, leaving the default compiler"
          fi
          gcc --version | head -1

      - name: Clone edk2-msm
        run: |
          set -eux
          git clone --depth 1 https://github.com/edk2-porting/edk2-msm.git
          cd edk2-msm
          # the repo pulls edk2, edk2-platforms, SimpleInit and the installer as
          # submodules; --depth 1 on submodules fails for several of them
          git submodule update --init --depth 1 || git submodule update --init
          cd Common/edk2 && git submodule update --init --depth 1 || git submodule update --init
          cd ../../Common/edk2-platforms && git submodule update --init --depth 1 || git submodule update --init
          cd ../../GPLDrivers/Library/SimpleInit && git submodule update --init --depth 1 || git submodule update --init
          cd ../../../
          df -h . | tail -1

      - name: Apply Meizu 15 overlay
        run: |
          set -eux
          cp edk2-msm-overlay/configs/devices/meizu15.conf edk2-msm/configs/devices/
          mkdir -p edk2-msm/Platform/Meizu/sdm660
          cp edk2-msm-overlay/Platform/Meizu/sdm660/meizu15.dsc      edk2-msm/Platform/Meizu/sdm660/
          cp edk2-msm-overlay/Platform/Meizu/sdm660/meizu15.fdf.inc  edk2-msm/Platform/Meizu/sdm660/
          ls -la edk2-msm/Platform/Meizu/sdm660/
          cat edk2-msm/configs/devices/meizu15.conf

      - name: Show what sdm660 provides
        run: |
          set -eux
          ls edk2-msm/Silicon/Qualcomm/sdm660
          ls edk2-msm/Platform/Qualcomm/sdm660
          cat edk2-msm/configs/sdm660.conf

      - name: Build
        run: |
          set -eux
          cd edk2-msm
          chmod +x build.sh
          # --skip-rootfs-gen must NOT be used: SimpleInitRootFS.inf still lists
          # build/rootfs.c as a source, so skipping its generation fails the build
          # with "build/rootfs.c is not found in packages path". Generating it needs
          # msgfmt (gettext), which the toolchain step installs.
          ./build.sh -d meizu15 -r RELEASE 2>&1 | tail -250
        continue-on-error: true

      - name: Locate output
        if: always()
        run: |
          echo "--- boot images ---"
          find edk2-msm -maxdepth 2 -name 'boot-*.img' -printf '%p  %s bytes\n' 2>/dev/null || true
          echo "--- FVs ---"
          find edk2-msm -name '*.fd' -printf '%p  %s bytes\n' 2>/dev/null | head -10 || true
          echo "--- build dirs ---"
          ls -la edk2-msm/workspace/Build 2>/dev/null || true

      - name: Upload boot image
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boot-meizu15
          path: |
            edk2-msm/boot-meizu15.img
            edk2-msm/workspace/Build/meizu15/**/FV/*.fd
          if-no-files-found: warn

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            edk2-msm/workspace/Build/meizu15/**/*.txt
          if-no-files-found: warn
