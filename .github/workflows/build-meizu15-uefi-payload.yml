name: build-meizu15-uefi-payload

# Firmware that can see the UniXNU payload.
#
# What this adds over build-meizu15-fix.yml (the image already proven on the phone):
#   * Meizu15PayloadDxe  finds the FAT volume inside the firmware volume and
#                        publishes it as a read-only EFI_BLOCK_IO_PROTOCOL device,
#   * EnhancedFatDxe / DiskIoDxe / PartitionDxe mount it,
#   * the FAT volume itself is embedded as a FREEFORM file with a compressed RAW
#     section (compressed because an FFS file cannot exceed 16 MiB).
#
# Why not UniXNU's UniXNURamDiskDxe: it reads a Mu-Silicium entry-argument HOB and
# /chosen/linux,initrd-start. edk2-msm's BootShim passes neither, and the edk2
# revision edk2-msm pins has no RamDiskLib anyway.

on:
  workflow_dispatch:
    inputs:
      skip_prober_fix:
        description: >-
          Do NOT patch SimpleInit's src/boot/prober.c. The patch is on by default
          because the shadowed loop variable only ever probes dir[0]; set this to
          true to build the unpatched prober for comparison.
        type: boolean
        default: false
      tiny_payload:
        description: >-
          Pack a fake 8 KB kernel instead of the real 15.8 MB one. The image drops
          to a couple of MB, so `fastboot boot` over USB 2.0 takes seconds instead
          of minutes. Use it while iterating on the boot menu; DarwinBoot will
          reject the fake kernel on purpose.
        type: boolean
        default: false
  push:
    paths:
      - 'edk2-msm-overlay/**'
      - 'scripts/build-esp.sh'
      - 'scripts/ci/**'
      - 'inputs/**'
      - '.github/workflows/build-meizu15-uefi-payload.yml'

jobs:
  firmware:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4
        with:
          path: meizu15

      - name: Install toolchain
        run: |
          set -eux
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            build-essential uuid-dev iasl nasm python3 python3-pip gettext \
            gcc-aarch64-linux-gnu git mtools dosfstools \
            clang lld llvm device-tree-compiler
          if ! command -v llvm-ar >/dev/null; then
            for c in /usr/lib/llvm-*/bin/llvm-ar; do
              [ -x "$c" ] && sudo ln -sf "$c" /usr/local/bin/llvm-ar && break
            done
          fi
          llvm-ar --version | head -1
          python3 -m pip install --quiet --break-system-packages edk2-pytool-library edk2-pytool-extensions || true

      - name: Pin GCC 12 for BaseTools
        run: |
          set -eux
          if apt-cache policy gcc-12 2>/dev/null | grep -q Candidate; then
            sudo apt-get install -y --no-install-recommends gcc-12 g++-12
            sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-12 100
            sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-12 100
          fi
          gcc --version | head -1

      - name: Clone edk2-msm
        run: |
          set -eux
          git clone --depth 1 https://github.com/edk2-porting/edk2-msm.git
          cd edk2-msm
          git submodule update --init --depth 1 || git submodule update --init
          cd Common/edk2 && git submodule update --init --depth 1 || git submodule update --init
          cd ../../Common/edk2-platforms && git submodule update --init --depth 1 || git submodule update --init
          cd ../../GPLDrivers/Library/SimpleInit && git submodule update --init --depth 1 || git submodule update --init
          cd ../../../

      - name: Apply the Meizu 15 overlay
        run: |
          set -eux
          cp meizu15/edk2-msm-overlay/configs/devices/meizu15.conf edk2-msm/configs/devices/
          cp -r meizu15/edk2-msm-overlay/UniXNUPkg edk2-msm/
          cp -r meizu15/edk2-msm-overlay/DarwinBootPkg edk2-msm/
          mkdir -p edk2-msm/Platform/Meizu/sdm660
          cp -r meizu15/edk2-msm-overlay/Platform/Meizu/sdm660/. edk2-msm/Platform/Meizu/sdm660/
          find edk2-msm/Platform/Meizu -type f -print

      - name: Append the payload entry to the device FDF include
        run: |
          set -eux
          F=edk2-msm/Platform/Meizu/sdm660/meizu15.fdf.inc
          {
            echo ""
            echo "// ---------------------------------------------------------------------------"
            echo "// UniXNU payload volume (appended by build-meizu15-uefi-payload.yml)"
            echo "//"
            echo "// A FREEFORM file with a compressed RAW section: compressed because an FFS"
            echo "// header carries its size in 24 bits (16 MiB ceiling); FREEFORM because"
            echo "// Meizu15PayloadDxe looks for this GUID and publishes the bytes as a block"
            echo "// device for EnhancedFatDxe to mount."
            echo "// ---------------------------------------------------------------------------"
            echo "FILE FREEFORM = 3f1a9c22-5b41-4a0e-9c77-2d618b4fe01a {"
            echo "  SECTION COMPRESS PI_STD {"
            echo "    SECTION RAW = Platform/Meizu/sdm660/payload/unixnu-esp.img"
            echo "  }"
            echo "}"
          } >> "$F"
          tail -14 "$F"

      - name: Patch SimpleInit free(NULL)
        run: |
          set -eux
          python3 meizu15/scripts/ci/patch_simpleinit_free.py edk2-msm

      - name: Build the payload FAT volume
        run: |
          set -eux
          mkdir -p edk2-msm/Platform/Meizu/sdm660/payload
          if [ -f meizu15/inputs/kernel.macho ]; then
            K=meizu15/inputs/kernel.macho
            echo "using the built kernel: $(wc -c < "$K") bytes"
          else
            head -c 2097152 /dev/zero > /tmp/placeholder.macho
            printf '\xcf\xfa\xed\xfe' | dd of=/tmp/placeholder.macho bs=1 seek=0 conv=notrunc status=none
            K=/tmp/placeholder.macho
            echo "::warning::no kernel in the tree, using a placeholder"
          fi
          cp meizu15/inputs/meizu15-8plus.adt /tmp/payload.adt
          bash meizu15/scripts/build-esp.sh "$K" /tmp/payload.adt \
               edk2-msm/Platform/Meizu/sdm660/payload/unixnu-esp.img 48
          ls -l edk2-msm/Platform/Meizu/sdm660/payload/

      - name: Build the firmware (RELEASE)
        run: |
          set -eux
          cd edk2-msm
          chmod +x build.sh
          ./build.sh -d meizu15 -r RELEASE 2>&1 | tail -400

      - name: Report and assert
        if: always()
        run: |
          echo "=== firmware artefacts ==="
          find edk2-msm -maxdepth 2 -name 'boot-*.img' -print 2>/dev/null || true
          find edk2-msm -name '*.fd' -print 2>/dev/null | head -3 || true
          echo "=== payload driver built? ==="
          find edk2-msm/Build -name 'Meizu15PayloadDxe*' 2>/dev/null | head -3 || true
          echo "=== payload volume in the tree ==="
          ls -l edk2-msm/Platform/Meizu/sdm660/payload/ 2>/dev/null || true
          if [ ! -f edk2-msm/boot-meizu15.img ]; then
            echo "::error::build.sh produced no boot-meizu15.img"
            exit 1
          fi

      - name: Retarget to the stock boot header
        if: success()
        run: |
          set -eux
          python3 meizu15/scripts/ci/retarget_header.py \
            edk2-msm/boot-meizu15.img \
            meizu15/edk2-msm-overlay/boot-header-1632.bin \
            edk2-msm/boot-meizu15-payload.img
          ls -l edk2-msm/boot-meizu15.img edk2-msm/boot-meizu15-payload.img

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: meizu15-uefi-payload
          path: |
            edk2-msm/boot-meizu15-payload.img
            edk2-msm/boot-meizu15.img
          if-no-files-found: warn

  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TARGET: DEBUG
    # Two payloads, every push. `full` carries the real 15.8 MB kernel and is what
    # the phone eventually has to boot; `tiny` swaps in an 8 KB fake Mach-O so the
    # image is a couple of MB and `fastboot boot` finishes on this USB 2.0 link,
    # where a 12 MB transfer has been failing halfway through.
    strategy:
      fail-fast: false
      matrix:
        payload: [full, tiny]

    steps:
      - uses: actions/checkout@v4
        with:
          path: meizu15

      - name: Install toolchain
        run: |
          set -eux
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            build-essential uuid-dev iasl nasm python3 python3-pip gettext \
            gcc-aarch64-linux-gnu git mtools dosfstools clang lld llvm device-tree-compiler
          if ! command -v llvm-ar >/dev/null; then
            for c in /usr/lib/llvm-*/bin/llvm-ar; do
              [ -x "$c" ] && sudo ln -sf "$c" /usr/local/bin/llvm-ar && break
            done
          fi
          llvm-ar --version | head -1

      - name: Pin GCC 12 for BaseTools
        run: |
          set -eux
          if apt-cache policy gcc-12 2>/dev/null | grep -q Candidate; then
            sudo apt-get install -y --no-install-recommends gcc-12 g++-12
            sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-12 100
            sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-12 100
          fi
          gcc --version | head -1

      - name: Clone edk2-msm
        run: |
          set -eux
          git clone --depth 1 https://github.com/edk2-porting/edk2-msm.git
          cd edk2-msm
          git submodule update --init --depth 1 || git submodule update --init
          cd Common/edk2 && git submodule update --init --depth 1 || git submodule update --init
          cd ../../Common/edk2-platforms && git submodule update --init --depth 1 || git submodule update --init
          cd ../../GPLDrivers/Library/SimpleInit && git submodule update --init --depth 1 || git submodule update --init
          cd ../../../

      - name: Apply the overlay and the payload entry
        run: |
          set -eux
          cp meizu15/edk2-msm-overlay/configs/devices/meizu15.conf edk2-msm/configs/devices/
          # The whole overlay: Platform/Meizu/sdm660, plus UniXNUPkg (the boot menu
          # application and its library) and DarwinBootPkg (the loader driver that
          # installs gUniXNULoaderProtocolGuid).
          cp -r meizu15/edk2-msm-overlay/UniXNUPkg edk2-msm/
          cp -r meizu15/edk2-msm-overlay/DarwinBootPkg edk2-msm/
          mkdir -p edk2-msm/Platform/Meizu/sdm660
          cp -r meizu15/edk2-msm-overlay/Platform/Meizu/sdm660/. edk2-msm/Platform/Meizu/sdm660/
          F=edk2-msm/Platform/Meizu/sdm660/meizu15.fdf.inc
          {
            echo ""
            echo "FILE FREEFORM = 3f1a9c22-5b41-4a0e-9c77-2d618b4fe01a {"
            echo "  SECTION COMPRESS PI_STD {"
            echo "    SECTION RAW = Platform/Meizu/sdm660/payload/unixnu-esp.img"
            echo "  }"
            echo "}"
          } >> "$F"

      - name: Patch SimpleInit free(NULL)
        run: python3 meizu15/scripts/ci/patch_simpleinit_free.py edk2-msm

      - name: Patch SimpleInit prober shadowed loop (optional)
        if: ${{ !inputs.skip_prober_fix }}
        run: |
          set -eux
          python3 meizu15/scripts/ci/patch_simpleinit_prober.py edk2-msm
          # The patch rewrote real code: show what the prober now walks.
          grep -rn "dir\[" edk2-msm/GPLDrivers/Library/SimpleInit/src/boot/prober.c | head -20

      - name: First pass, to produce the launcher
        run: |
          set -eux
          cd edk2-msm
          # Two passes are unavoidable: the launcher .efi has to exist before it can be put
          # on the payload volume, and the volume has to exist before it can be
          # embedded in the firmware. The first pass packs a throwaway volume so the
          # FDF reference resolves; the second pass packs the real one.
          mkdir -p Platform/Meizu/sdm660/payload
          printf 'placeholder' > Platform/Meizu/sdm660/payload/unixnu-esp.img
          chmod +x build.sh
          ./build.sh -d meizu15 -r DEBUG 2>&1 | tail -120
          EFI=$(find . -name 'Meizu15Launcher.efi' | head -1)
          echo "launcher from the first pass: ${EFI:-NONE}"
          [ -n "$EFI" ] || { echo "::error::no Meizu15Launcher.efi was produced"; exit 1; }
          cp "$EFI" /tmp/Meizu15Launcher.efi
          ls -l /tmp/Meizu15Launcher.efi
        continue-on-error: false

      - name: Shrink the payload for fast iteration (optional)
        if: ${{ inputs.tiny_payload || matrix.payload == 'tiny' }}
        run: |
          set -eux
          python3 meizu15/scripts/ci/make-fake-payload.py /tmp/tiny 8192 13996
          {
            echo "KERNEL_SRC=/tmp/tiny/kernel.macho"
            echo "ADT_SRC=/tmp/tiny/kernel.macho.adt"
            echo "ESP_MB=8"
          } >> "$GITHUB_ENV"
          ls -l /tmp/tiny

      - name: Pack the real payload volume with BOOTAA64.EFI
        run: |
          set -eux
          cp "${KERNEL_SRC:-meizu15/inputs/kernel.macho}" /tmp/kernel.macho
          cp "${ADT_SRC:-meizu15/inputs/meizu15-8plus.adt}" /tmp/payload.adt
          ls -l /tmp/kernel.macho /tmp/payload.adt
          bash meizu15/scripts/build-esp.sh /tmp/kernel.macho /tmp/payload.adt \
               edk2-msm/Platform/Meizu/sdm660/payload/unixnu-esp.img "${ESP_MB:-48}"
          IMG=edk2-msm/Platform/Meizu/sdm660/payload/unixnu-esp.img
          # SimpleInit's prober builds its candidate list from
          # ARCH1_FILE("boot","aa64") in src/boot/efi_path.c, i.e. the literal string
          # "bootaa64.efi", searched under "/", "/EFI/" and "/EFI/BOOT/". mtools keeps
          # the name we give it (FAT itself is case-insensitive, but the firmware's
          # file layer opens by name), so ship both spellings and a startup.nsh that
          # runs it if the Shell comes up instead.
          mmd -i "$IMG" ::/EFI 2>/dev/null || true
          mmd -i "$IMG" ::/EFI/BOOT 2>/dev/null || true
          mcopy -i "$IMG" -o /tmp/Meizu15Launcher.efi ::/EFI/BOOT/BOOTAA64.EFI
          #
          # SimpleInit's prober has a shadowed loop variable:
          #
          #   for(size_t d=0;ep->dir[d];d++) for(size_t d=0;ep->name[d];d++) { ... }
          #
          # The inner d clobbers the outer one, so only dir[0] -- the literal "/" --
          # is ever tried. That is why the menu says "found UEFI Shell at /shell.efi"
          # and not "/EFI/tools/shell.efi". So the launcher has to sit at the ROOT of
          # the volume under the name the table uses for this CPU: bootaa64.efi.
          #
          mcopy -i "$IMG" -o /tmp/Meizu15Launcher.efi ::/bootaa64.efi
          # startup.nsh DOES run the launcher. The menu's first entry is the UEFI
          # Shell, so the Shell is what the countdown picks and startup.nsh is the
          # one path that reaches the launcher without a keypress. The launcher
          # now holds its first frame for ten seconds, so the panel still shows
          # "Meizu15Launcher: looking for ..." long enough to be read.
          printf 'echo -r Meizu15: SimpleInit fell through to the Shell; starting the launcher.\r\nfs0:\\bootaa64.efi\r\n' > /tmp/startup.nsh
          mcopy -i "$IMG" -o /tmp/startup.nsh ::/startup.nsh
          mdir -i "$IMG" ::/EFI/BOOT
          mdir -i "$IMG" ::/ | tail -14

      - name: Assert the payload volume layout
        run: |
          set -eux
          IMG=edk2-msm/Platform/Meizu/sdm660/payload/unixnu-esp.img
          mdir -i "$IMG" ::/ -/ > esp-listing.txt
          cat esp-listing.txt
          # While prober.c's loop variable is still shadowed only dir[0] -- "/" --
          # is probed, so the launcher has to sit at the volume root, otherwise the
          # menu comes up without our entry and the next 12-minute fastboot round
          # trip buys nothing. Assert it here instead of on the phone.
          grep -qi 'bootaa64 *efi' esp-listing.txt || {
            echo "::error::/bootaa64.efi is not at the payload volume root"; exit 1; }
          grep -qi 'startup *nsh' esp-listing.txt || {
            echo "::error::/startup.nsh is not at the payload volume root"; exit 1; }
          grep -qi 'kernel\.macho' esp-listing.txt || {
            echo "::error::/EFI/UniXNU/Payloads/kernel.macho is missing"; exit 1; }
          grep -qi 'kernel\.macho\.adt' esp-listing.txt || {
            echo "::error::/EFI/UniXNU/Payloads/kernel.macho.adt is missing"; exit 1; }
          grep -qi 'unixnu\.toml' esp-listing.txt || {
            echo "::error::/EFI/UniXNU/unixnu.toml is missing"; exit 1; }
          echo "payload volume layout OK"

      - name: Build the firmware (DEBUG)
        run: |
          set -eux
          cd edk2-msm
          chmod +x build.sh
          ./build.sh -d meizu15 -r DEBUG 2>&1 | tail -300

      - name: Retarget and upload
        if: always()
        run: |
          set -eux
          ls -l edk2-msm/boot-meizu15.img || true
          if [ -f edk2-msm/boot-meizu15.img ]; then
            python3 meizu15/scripts/ci/retarget_header.py \
              edk2-msm/boot-meizu15.img \
              meizu15/edk2-msm-overlay/boot-header-1632.bin \
              edk2-msm/boot-meizu15-payload-debug.img
            ls -l edk2-msm/boot-meizu15-payload-debug.img
            # Walk the finished image once more from the outside: if the payload
            # FREEFORM file did not survive the FDF, say so here and not on the
            # phone. Non-zero here means the image is not worth a fastboot trip.
            python3 meizu15/scripts/check_payload_fv.py \
              edk2-msm/boot-meizu15-payload-debug.img | tee payload-fv.txt
          fi

      - name: Verify the finished image from the outside
        if: always()
        run: |
          set -eux -o pipefail
          IMG=edk2-msm/boot-meizu15-payload-debug.img
          if [ ! -f "$IMG" ]; then
            echo "::error::no $IMG to verify"; exit 1
          fi
          # The payload volume is inside a COMPRESSED firmware section, so this is
          # the only place the shipped bytes are actually read back: boot.img ->
          # gzip -> FV -> FFS 3F1A9C22 -> COMPRESSED -> 48 MiB FAT -> tree.
          # UEFIExtract does the section decompression; the rest is our own code.
          curl -sSL -o /tmp/ue.zip \
            https://github.com/LongSoft/UEFITool/releases/download/A76/UEFIExtract_NE_A76_x64_linux.zip
          # Unpack with python3 rather than unzip (not guaranteed on the runner) and
          # look the binary up instead of assuming the archive has no top directory.
          # The linux release ships it as lower-case "uefiextract", the windows one
          # as "UEFIExtract.exe", so match case-insensitively.
          python3 -c "import zipfile; zipfile.ZipFile('/tmp/ue.zip').extractall('/tmp/ue')"
          ls -lR /tmp/ue | head -20
          UE=$(find /tmp/ue -type f -iname 'uefiextract*' | head -1)
          [ -n "$UE" ] || { echo "::error::UEFIExtract missing from the archive"; exit 1; }
          chmod +x "$UE"
          python3 meizu15/scripts/ci/verify-payload-image.py "$IMG" \
            --uefiextract "$UE" --keep /tmp/verify | tee payload-image.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          # The matrix dimension is part of the name: two jobs cannot publish the
          # same artifact name in one run.
          name: meizu15-uefi-payload-debug-${{ matrix.payload }}
          path: |
            edk2-msm/boot-meizu15-payload-debug.img
            esp-listing.txt
            payload-fv.txt
            payload-image.txt
          if-no-files-found: warn