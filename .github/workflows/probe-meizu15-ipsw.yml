name: probe-meizu15-ipsw

# Pull only what the device description still guesses at, straight from Apple's
# restore image, without downloading the 5 GB file:
#
#   * BuildManifest.plist  -> d21ap ApBoardID  (board.toml [ipsw] board_id is 0x0E, a guess)
#   * KernelCache          -> sha256 of the decompressed kernelcache
#                             (board.toml [kernel.prelink] kernelcache_sha256 is still the
#                              iPhone X / d22ap value copied from lavender)
#   * DeviceTree, StaticTrustCache, Cryptex1,SystemTrustCache -> the same list unixnu fetches
#
# unixnu reads the IPSW over HTTP range requests, so only those members cross the wire.

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/probe-meizu15-ipsw.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout device repository
        uses: actions/checkout@v4
        with:
          path: device

      - name: Clone UniXNU
        run: |
          set -eux
          git clone --depth 1 https://github.com/UniXNU/UniXNU.git unixnu

      - name: Select defconfig
        run: |
          set -eux
          cd unixnu
          ./unixnu defconfig meizu15_defconfig -D ../device

      - name: IPSW info
        run: |
          set -eux
          cd unixnu
          ./unixnu ipsw info 2>&1 | tee /tmp/ipsw-info.txt | head -80
        continue-on-error: true

      - name: IPSW fetch (small members + kernelcache)
        run: |
          set -eux
          cd unixnu
          ./unixnu ipsw fetch 2>&1 | tail -60
        continue-on-error: true

      - name: Hash what came out
        run: |
          set -eux
          echo "--- files ---"
          find unixnu/out -path '*ipsw*' -type f -printf '%p  %s bytes\n' 2>/dev/null | head -30 || true
          echo "--- sha256 ---"
          find unixnu/out -path '*ipsw*' -type f -size +1M -print0 2>/dev/null \
            | xargs -0r sha256sum | head -20 || true

      - name: BuildManifest straight off the remote IPSW
        run: |
          set -eux
          python3 - <<'PY' 2>&1 | tee /tmp/boardid.txt
          import sys, io, plistlib, zipfile, traceback
          sys.path.insert(0, 'unixnu/scripts')
          URL = ("https://updates.cdn-apple.com/2025FallFCS/fullrestores/122-76738/"
                 "B6C604B4-548E-401F-BBFF-916E3FFDF235/iPhone_5.5_P3_16.7.16_20H392_Restore.ipsw")
          try:
              from unixnu.ipsw import RangeFile
          except Exception:
              traceback.print_exc(); sys.exit(0)
          try:
              with RangeFile(URL) as raw:
                  fh = io.BufferedReader(raw)
                  z = zipfile.ZipFile(fh)
                  names = [n for n in z.namelist() if n.endswith('BuildManifest.plist')]
                  print("manifest members:", names)
                  blob = z.read(names[0])
              m = plistlib.loads(blob)
          except Exception:
              traceback.print_exc(); sys.exit(0)
          print("ProductVersion :", m.get("ProductVersion"))
          print("ProductBuild   :", m.get("ProductBuildVersion"))
          print("Supported      :", m.get("SupportedProductTypes"))
          print()
          print("%-3s %-14s %-8s %-10s %-12s %s" % ("#", "ProductType", "DeviceClass", "ApBoardID", "Restore", "ManifestName"))
          for i, ident in enumerate(m.get("BuildIdentities", [])):
              info = ident.get("Info", {})
              bid = info.get("ApBoardID")
              print("%-3d %-14s %-8s %-10s %-12s %s" % (
                  i, info.get("ProductType"), info.get("DeviceClass"),
                  ("0x%X" % bid) if isinstance(bid, int) else bid,
                  info.get("RestoreBehavior"), ident.get("ManifestName")))
          PY
        continue-on-error: true
      - name: Upload probe output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ipsw-probe
          path: |
            /tmp/ipsw-info.txt
            /tmp/boardid.txt
          if-no-files-found: warn
